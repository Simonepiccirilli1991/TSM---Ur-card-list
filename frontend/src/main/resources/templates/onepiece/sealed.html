<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content})}">
<head>
    <title>Sealed One Piece</title>
</head>
<body>
<th:block th:fragment="content">
    <div th:with="pageTitle='Sealed One Piece'">

        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">🏴‍☠️ I Miei Sealed One Piece</h1>
                <p class="text-gray-500" th:text="${#lists.size(sealedList)} + ' prodotti trovati'">0 prodotti</p>
            </div>
            <a href="/onepiece/sealed/add"
               class="inline-flex items-center gap-2 bg-red-500 hover:bg-red-600 text-white font-semibold px-6 py-3 rounded-lg transition-colors">
                ➕ Aggiungi Sealed
            </a>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-md p-4 mb-6">
            <form method="get" class="flex flex-wrap items-center gap-4">
                <label class="text-sm font-medium text-gray-600">Filtra per stato:</label>
                <select name="stato" onchange="this.form.submit()"
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500">
                    <option value="">Tutti</option>
                    <option value="in_collezione" th:selected="${selectedStato == 'in_collezione'}">In Collezione</option>
                    <option value="in_vendita" th:selected="${selectedStato == 'in_vendita'}">In Vendita</option>
                    <option value="venduto" th:selected="${selectedStato == 'venduto'}">Venduto</option>
                </select>
                <a th:if="${selectedStato}" href="/onepiece/sealed" class="text-sm text-gray-500 hover:text-gray-700">✕ Reset filtri</a>
            </form>
        </div>

        <!-- Sealed Grid -->
        <div th:if="${!#lists.isEmpty(sealedList)}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div th:each="sealed : ${sealedList}" class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow">
                <!-- Image -->
                <div class="h-48 bg-gradient-to-br from-red-100 to-red-200 flex items-center justify-center">
                    <span th:if="${sealed.foto == null}" class="text-6xl">🏴‍☠️</span>
                    <img th:if="${sealed.foto != null}" th:src="'data:image/jpeg;base64,' + ${sealed.foto}" class="h-full w-full object-cover" alt="Sealed">
                </div>

                <!-- Info -->
                <div class="p-4">
                    <h3 class="font-bold text-lg text-gray-800 mb-1" th:text="${sealed.nome}">Nome Prodotto</h3>
                    <p class="text-sm text-gray-500 mb-2" th:text="${sealed.espansione}">Espansione</p>

                    <div class="flex items-center justify-between mb-3">
                        <span class="text-lg font-bold text-green-600" th:text="${#numbers.formatDecimal(sealed.prezzoAcquisto, 1, 2)} + ' €'">0 €</span>
                        <span class="px-2 py-1 text-xs rounded-full"
                              th:classappend="${sealed.stato == 'venduto'} ? 'bg-green-100 text-green-800' : (${sealed.stato == 'in_vendita'} ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-800')"
                              th:text="${sealed.stato ?: 'in_collezione'}">Stato</span>
                    </div>

                    <!-- Actions -->
                    <div class="flex gap-2">
                        <a th:href="@{/onepiece/sealed/{id}(id=${sealed.id})}"
                           class="flex-1 text-center bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg text-sm transition-colors">
                            Dettagli
                        </a>
                        <form th:action="@{/onepiece/sealed/{id}/delete(id=${sealed.id})}" method="post" class="flex-1"
                              onsubmit="return confirm('Sei sicuro di voler eliminare questo prodotto?')">
                            <button type="submit" class="w-full bg-red-100 hover:bg-red-200 text-red-700 py-2 rounded-lg text-sm transition-colors">
                                Elimina
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(sealedList)}" class="bg-white rounded-xl shadow-md p-12 text-center">
            <span class="text-6xl mb-4 block">🏴‍☠️</span>
            <h3 class="text-xl font-semibold text-gray-800 mb-2">Nessun sealed trovato</h3>
            <p class="text-gray-500 mb-6">Inizia ad aggiungere i tuoi prodotti sealed One Piece!</p>
            <a href="/onepiece/sealed/add" class="inline-flex items-center gap-2 bg-red-500 hover:bg-red-600 text-white font-semibold px-6 py-3 rounded-lg transition-colors">
                ➕ Aggiungi il primo sealed
            </a>
        </div>

    </div>
</th:block>
</body>
</html>
