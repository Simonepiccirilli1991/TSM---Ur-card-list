<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content})}">
<head>
    <title>Dettaglio Sealed One Piece</title>
</head>
<body>
<th:block th:fragment="content">
    <div th:with="pageTitle='Dettaglio Sealed One Piece'">

        <!-- Back Link -->
        <a href="/onepiece/sealed" class="inline-flex items-center gap-2 text-gray-600 hover:text-gray-800 mb-6">
            ← Torna alla lista
        </a>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Image -->
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="aspect-square bg-gradient-to-br from-red-100 to-red-200 rounded-lg flex items-center justify-center">
                    <span th:if="${sealed.foto == null}" class="text-8xl">🏴‍☠️</span>
                    <img th:if="${sealed.foto != null}" th:src="'data:image/jpeg;base64,' + ${sealed.foto}" class="h-full w-full object-cover rounded-lg" alt="Sealed">
                </div>
            </div>

            <!-- Details -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Main Info -->
                <div class="bg-white rounded-xl shadow-md p-6">
                    <div class="flex items-start justify-between mb-4">
                        <div>
                            <h1 class="text-3xl font-bold text-gray-800" th:text="${sealed.nome}">Nome Prodotto</h1>
                            <p class="text-lg text-gray-500" th:text="${sealed.espansione}">Espansione</p>
                        </div>
                        <span class="px-3 py-1 text-sm rounded-full font-medium"
                              th:classappend="${sealed.stato == 'venduto'} ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800'"
                              th:text="${sealed.stato == 'venduto'} ? 'Venduto' : 'Disponibile'">Stato</span>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div>
                            <p class="text-sm text-gray-500">Lingua</p>
                            <p class="font-medium" th:text="${sealed.lingua}">-</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">Data Acquisto</p>
                            <p class="font-medium" th:text="${sealed.dataAcquisto}">-</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500">Acquistato Presso</p>
                            <p class="font-medium" th:text="${sealed.acquistatoPresso ?: '-'}">-</p>
                        </div>
                    </div>
                </div>

                <!-- Financial Info -->
                <div class="bg-white rounded-xl shadow-md p-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">💰 Informazioni Economiche</h3>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div>
                            <p class="text-sm text-gray-500">Prezzo Acquisto</p>
                            <p class="text-xl font-bold text-red-600" th:text="${#numbers.formatDecimal(sealed.prezzoAcquisto, 1, 2)} + ' €'">0 €</p>
                        </div>
                        <div th:if="${sealed.prezzoVendita != null}">
                            <p class="text-sm text-gray-500">Prezzo Vendita</p>
                            <p class="text-xl font-bold text-green-600" th:text="${#numbers.formatDecimal(sealed.prezzoVendita, 1, 2)} + ' €'">0 €</p>
                        </div>
                        <div th:if="${sealed.netto != null}">
                            <p class="text-sm text-gray-500">Profitto Netto</p>
                            <p class="text-xl font-bold"
                               th:classappend="${sealed.netto >= 0} ? 'text-green-600' : 'text-red-600'"
                               th:text="${#numbers.formatDecimal(sealed.netto, 1, 2)} + ' €'">0 €</p>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex gap-4">
                    <a th:if="${sealed.stato != 'venduto'}"
                       th:href="@{/vendita/vendi(idProdotto=${sealed.id}, tipoProdotto='ONEPIECE_SEALED', nomeProdotto=${sealed.nome})}"
                       class="flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-lg transition-colors text-center">
                        💰 Vendi Sealed
                    </a>
                    <form th:action="@{/onepiece/sealed/{id}/delete(id=${sealed.id})}" method="post" class="flex-1"
                          onsubmit="return confirm('Sei sicuro di voler eliminare questo prodotto?')">
                        <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-3 rounded-lg transition-colors">
                            🗑️ Elimina Sealed
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</th:block>
</body>
</html>
