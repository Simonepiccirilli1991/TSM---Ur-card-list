<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content})}">
<head>
    <title>Carte Pokemon</title>
</head>
<body>
<th:block th:fragment="content">
    <div th:with="pageTitle='Carte Pokemon'">

        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">🃏 Le Mie Carte Pokemon</h1>
                <p class="text-gray-500" th:text="${#lists.size(cards)} + ' carte trovate'">0 carte</p>
            </div>
            <a href="/pokemon/cards/add"
               class="inline-flex items-center gap-2 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold px-6 py-3 rounded-lg transition-colors">
                ➕ Aggiungi Carta
            </a>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-md p-4 mb-6">
            <form method="get" class="flex flex-wrap items-center gap-4">
                <label class="text-sm font-medium text-gray-600">Filtra per stato:</label>
                <select name="stato" onchange="this.form.submit()"
                        class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500">
                    <option value="">Tutti</option>
                    <option value="in_collezione" th:selected="${selectedStato == 'in_collezione'}">In Collezione</option>
                    <option value="in_vendita" th:selected="${selectedStato == 'in_vendita'}">In Vendita</option>
                    <option value="venduto" th:selected="${selectedStato == 'venduto'}">Venduto</option>
                </select>
                <a th:if="${selectedStato}" href="/pokemon/cards" class="text-sm text-gray-500 hover:text-gray-700">✕ Reset filtri</a>
            </form>
        </div>

        <!-- Cards Grid -->
        <div th:if="${!#lists.isEmpty(cards)}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div th:each="card : ${cards}" class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow">
                <!-- Card Image -->
                <div class="h-48 bg-gradient-to-br from-yellow-100 to-yellow-200 flex items-center justify-center">
                    <span th:if="${card.foto == null}" class="text-6xl">🃏</span>
                    <img th:if="${card.foto != null}" th:src="'data:image/jpeg;base64,' + ${card.foto}" class="h-full w-full object-cover" alt="Card">
                </div>

                <!-- Card Info -->
                <div class="p-4">
                    <h3 class="font-bold text-lg text-gray-800 mb-1" th:text="${card.nome}">Nome Carta</h3>
                    <p class="text-sm text-gray-500 mb-2" th:text="${card.espansione}">Espansione</p>

                    <div class="flex items-center justify-between mb-3">
                        <span class="text-lg font-bold text-green-600" th:text="${#numbers.formatDecimal(card.prezzoAcquisto, 1, 2)} + ' €'">0 €</span>
                        <span class="px-2 py-1 text-xs rounded-full"
                              th:classappend="${card.stato == 'venduto'} ? 'bg-green-100 text-green-800' : (${card.stato == 'in_vendita'} ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-800')"
                              th:text="${card.stato ?: 'in_collezione'}">Stato</span>
                    </div>

                    <!-- Grading Badge -->
                    <div th:if="${card.gradata}" class="mb-3">
                        <span class="inline-flex items-center gap-1 px-2 py-1 bg-purple-100 text-purple-800 text-xs rounded-full">
                            ⭐ <span th:text="${card.enteGradazione} + ' ' + ${card.votoGradazione}">PSA 10</span>
                        </span>
                    </div>

                    <!-- Actions -->
                    <div class="flex gap-2">
                        <a th:href="@{/pokemon/cards/{id}(id=${card.id})}"
                           class="flex-1 text-center bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg text-sm transition-colors">
                            Dettagli
                        </a>
                        <form th:action="@{/pokemon/cards/{id}/delete(id=${card.id})}" method="post" class="flex-1"
                              onsubmit="return confirm('Sei sicuro di voler eliminare questa carta?')">
                            <button type="submit" class="w-full bg-red-100 hover:bg-red-200 text-red-700 py-2 rounded-lg text-sm transition-colors">
                                Elimina
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(cards)}" class="bg-white rounded-xl shadow-md p-12 text-center">
            <span class="text-6xl mb-4 block">🃏</span>
            <h3 class="text-xl font-semibold text-gray-800 mb-2">Nessuna carta trovata</h3>
            <p class="text-gray-500 mb-6">Inizia ad aggiungere le tue carte Pokemon alla collezione!</p>
            <a href="/pokemon/cards/add" class="inline-flex items-center gap-2 bg-yellow-500 hover:bg-yellow-600 text-white font-semibold px-6 py-3 rounded-lg transition-colors">
                ➕ Aggiungi la prima carta
            </a>
        </div>

    </div>
</th:block>
</body>
</html>
