<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::content})}">
<head>
    <title>Vendi Prodotto</title>
</head>
<body>
<th:block th:fragment="content">
    <div th:with="pageTitle='Vendi Prodotto'">

        <div class="max-w-lg mx-auto">
            <!-- Header -->
            <div class="flex items-center justify-between mb-4">
                <a href="javascript:history.back()" class="text-gray-500 hover:text-gray-700 text-sm">← Indietro</a>
                <span class="text-green-500 text-2xl">💰</span>
            </div>

            <!-- Form -->
            <form th:action="@{/vendita/vendi}" th:object="${form}" method="post" class="bg-white rounded-lg border border-gray-200 p-6">

                <h2 class="text-lg font-bold text-gray-800 mb-2">Vendi Prodotto</h2>
                <p class="text-sm text-gray-500 mb-4">
                    <span th:text="${nomeProdotto}">Nome Prodotto</span>
                    <span class="text-xs text-gray-400" th:text="' (' + ${tipoProdotto} + ')'"></span>
                </p>

                <!-- Hidden fields -->
                <input type="hidden" th:field="*{idProdotto}">
                <input type="hidden" th:field="*{tipoProdotto}">

                <!-- Prezzo Vendita -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Prezzo di Vendita *</label>
                    <div class="relative">
                        <input type="number" th:field="*{prezzoVendita}" required step="0.01" min="0" placeholder="0.00"
                               class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500">
                        <span class="absolute right-3 top-2 text-gray-400 text-sm">€</span>
                    </div>
                </div>

                <!-- Costi Vendita -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Costi di Vendita (commissioni, spedizione, ecc.)</label>
                    <div class="relative">
                        <input type="number" th:field="*{costiVendita}" step="0.01" min="0" placeholder="0.00"
                               class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500">
                        <span class="absolute right-3 top-2 text-gray-400 text-sm">€</span>
                    </div>
                </div>

                <!-- Data Vendita -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Data di Vendita *</label>
                    <input type="date" th:field="*{dataVendita}" required
                           class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500">
                </div>

                <!-- Piattaforma Vendita -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Piattaforma di Vendita</label>
                    <select th:field="*{piattaformaVendita}"
                            class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500">
                        <option value="">Seleziona piattaforma...</option>
                        <option value="eBay">eBay</option>
                        <option value="Cardmarket">Cardmarket</option>
                        <option value="Vinted">Vinted</option>
                        <option value="Facebook Marketplace">Facebook Marketplace</option>
                        <option value="Subito">Subito</option>
                        <option value="TCGPlayer">TCGPlayer</option>
                        <option value="Privato">Vendita Privata</option>
                        <option value="Negozio">Negozio Fisico</option>
                        <option value="Altro">Altro</option>
                    </select>
                </div>

                <!-- Note -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Note</label>
                    <textarea th:field="*{note}" rows="3" placeholder="Note sulla vendita..."
                              class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500"></textarea>
                </div>

                <!-- Riepilogo -->
                <div class="bg-gray-50 rounded-lg p-4 mb-4">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">Riepilogo</h3>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Prezzo Vendita:</span>
                        <span id="riepilogoPrezzoVendita" class="font-medium">€ 0.00</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-500">Costi:</span>
                        <span id="riepilogoCosti" class="font-medium text-red-500">- € 0.00</span>
                    </div>
                    <div class="border-t border-gray-200 mt-2 pt-2 flex justify-between text-sm">
                        <span class="text-gray-700 font-medium">Netto:</span>
                        <span id="riepilogoNetto" class="font-bold text-green-600">€ 0.00</span>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded text-sm transition-colors">
                        💰 Conferma Vendita
                    </button>
                    <a href="javascript:history.back()" class="px-4 py-2 border border-gray-300 text-gray-600 rounded hover:bg-gray-50 text-sm">
                        Annulla
                    </a>
                </div>
            </form>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const prezzoInput = document.getElementById('prezzoVendita');
                const costiInput = document.getElementById('costiVendita');
                const riepilogoPrezzoVendita = document.getElementById('riepilogoPrezzoVendita');
                const riepilogoCosti = document.getElementById('riepilogoCosti');
                const riepilogoNetto = document.getElementById('riepilogoNetto');

                function updateRiepilogo() {
                    const prezzo = parseFloat(prezzoInput.value) || 0;
                    const costi = parseFloat(costiInput.value) || 0;
                    const netto = prezzo - costi;

                    riepilogoPrezzoVendita.textContent = '€ ' + prezzo.toFixed(2);
                    riepilogoCosti.textContent = '- € ' + costi.toFixed(2);
                    riepilogoNetto.textContent = '€ ' + netto.toFixed(2);

                    if (netto < 0) {
                        riepilogoNetto.classList.remove('text-green-600');
                        riepilogoNetto.classList.add('text-red-600');
                    } else {
                        riepilogoNetto.classList.remove('text-red-600');
                        riepilogoNetto.classList.add('text-green-600');
                    }
                }

                prezzoInput.addEventListener('input', updateRiepilogo);
                costiInput.addEventListener('input', updateRiepilogo);
            });
        </script>

    </div>
</th:block>
</body>
</html>
